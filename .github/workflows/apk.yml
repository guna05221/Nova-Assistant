name: Nova APK (validated debug build)

on:
  push:
    branches:
      - phase1/brain-foundation
      - feature/parakeet-unified-asr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Validate, compile, sign, and package debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configure persistent Nova signing
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NOVA_KEYSTORE_BASE64"
          test -n "$NOVA_KEYSTORE_PASSWORD"
          test -n "$NOVA_KEY_ALIAS"
          test -n "$NOVA_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/nova-release.jks"
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "NOVA_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "NOVA_KEYSTORE_PASSWORD=$NOVA_KEYSTORE_PASSWORD"
            echo "NOVA_KEY_ALIAS=$NOVA_KEY_ALIAS"
            echo "NOVA_KEY_PASSWORD=$NOVA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Download Sherpa ONNX compile dependency
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar" -o app/libs/sherpa-onnx-1.13.2.aar
          test -s app/libs/sherpa-onnx-1.13.2.aar

      - name: Run unit tests and build signed debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Parakeet-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
