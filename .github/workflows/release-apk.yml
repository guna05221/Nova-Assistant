name: Nova AI APK release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build debug APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Sherpa ONNX compile dependency
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
          test -s app/libs/sherpa-onnx-2.0.1.aar

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" apk-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nova AI debug build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated debug APK built from commit ${GITHUB_SHA}. This is a test build, not a production-signed release." \
            --prerelease \
            --target "$GITHUB_SHA"
