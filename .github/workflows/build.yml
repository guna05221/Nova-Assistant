name: Nova validation (tests only)

on:
  push:
    branches:
      - phase1/brain-foundation
      - validation/voice-identity-crashfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Kotlin compile and unit tests (no APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Sherpa ONNX compile dependency
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
          test -s app/libs/sherpa-onnx-2.0.1.aar

      - name: Compile and run unit tests
        run: gradle --no-daemon testDebugUnitTest
