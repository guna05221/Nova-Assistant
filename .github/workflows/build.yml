name: Build Nova debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/voice-conversation-pipeline]
    paths:
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download Sherpa ONNX speaker verification runtime and model
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx" -o app/src/main/assets/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
          test -s app/libs/sherpa-onnx-2.0.1.aar
          test -s app/src/main/assets/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
      - name: Prepare persistent signing key (when configured)
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOVA_KEYSTORE_BASE64" ]; then
            echo "$NOVA_KEYSTORE_BASE64" | base64 --decode > app/nova-release.jks
            test -s app/nova-release.jks
          else
            echo "Persistent signing key is not configured yet; using temporary debug signing."
          fi
      - name: Build debug APK
        env:
          NOVA_KEYSTORE_FILE: ${{ secrets.NOVA_KEYSTORE_BASE64 != '' && 'nova-release.jks' || '' }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
