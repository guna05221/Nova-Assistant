name: Build Nova debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and prepare Vosk English model
        run: |
          set -euo pipefail
          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          MODEL_SHA256="30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498"
          curl -fL --retry 3 "$MODEL_URL" -o /tmp/vosk-model.zip
          echo "$MODEL_SHA256  /tmp/vosk-model.zip" | sha256sum -c -
          mkdir -p /tmp/vosk-model app/src/main/assets/model
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          cp -a /tmp/vosk-model/vosk-model-small-en-us-0.15/. app/src/main/assets/model/
          # Vosk Android StorageService.unpack requires this marker file.
          python3 -c 'import uuid; print(uuid.uuid4())' > app/src/main/assets/model/uuid
          test -s app/src/main/assets/model/uuid
          test -d app/src/main/assets/model/am
          test -d app/src/main/assets/model/conf
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
